name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Skipped on the template repository itself: it has no site to publish and
    # every placeholder is still in place, so the run could only ever fail.
    # `deploy` needs this job, so skipping here skips the whole workflow.
    # See .github/workflows/check.yml for why this is keyed on is_template.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Read from .tool-versions so CI and local development can never
          # disagree about the Node version.
          node-version-file: .tool-versions
          cache: npm

      - run: npm ci
      - run: npm run build

      # Fails while any TODO: placeholder is still in the source. Delete this
      # step if you would rather ship a partially filled-in site.
      - run: npm run check:todos

      # Validates the social-card metadata against the built output.
      - run: npm run check:og

      # Validates what machines read: the JSON-LD on every page, /llms.txt, the
      # markdown mirrors, and the AI-crawler policy in robots.txt.
      - run: npm run check:ai

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
